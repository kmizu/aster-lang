[workspace]
members = [
  "crates/aster-diagnostics",
  "crates/aster-syntax",
  "crates/aster-semantics",
  "crates/aster-ir",
  "crates/aster-runtime",
  "crates/aster-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
clap = { version = "4.5.42", features = ["derive"] }
hex = "0.4.3"
sha2 = "0.10.9"
tempfile = "3.20.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
