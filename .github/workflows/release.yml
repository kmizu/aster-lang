name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Install release check prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Require tag to match the workspace version
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 1
          fi
      - name: Check release contract
        run: ./scripts/check-release.sh
      - name: Check release site
        run: ./scripts/check-site.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: aster
            format: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: aster
            format: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: aster
            format: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: aster.exe
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Restore canonical checkout bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
      - name: Install Linux musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test native target
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p aster-cli --bin aster --target ${{ matrix.target }}
      - name: Smoke-test Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target/${{ matrix.target }}/release/aster --version
          target/${{ matrix.target }}/release/aster check examples/meeting-scheduler/main.aster
          target/${{ matrix.target }}/release/aster check examples/governed-note/main.aster
      - name: Smoke-test Windows release binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target/${{ matrix.target }}/release/aster.exe --version
          target/${{ matrix.target }}/release/aster.exe check examples/meeting-scheduler/main.aster
          target/${{ matrix.target }}/release/aster.exe check examples/governed-note/main.aster
      - name: Stage release archive
        id: release-metadata
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          bundle="aster-v${version}-${{ matrix.target }}"
          case "${{ matrix.format }}" in
            tar.gz) asset="${bundle}.tar.gz" ;;
            zip) asset="${bundle}.zip" ;;
          esac
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          staging="dist/$bundle"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp README.md LICENSE "$staging/"
      - name: Create tar archive
        if: matrix.format == 'tar.gz'
        shell: bash
        run: tar -C "dist/${{ steps.release-metadata.outputs.bundle }}" -czf "dist/${{ steps.release-metadata.outputs.asset }}" .
      - name: Create zip archive
        if: matrix.format == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ steps.release-metadata.outputs.bundle }}/*" -DestinationPath "dist/${{ steps.release-metadata.outputs.asset }}"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ steps.release-metadata.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify exact archive set and create checksums
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          expected=(
            "aster-v${version}-aarch64-apple-darwin.tar.gz"
            "aster-v${version}-x86_64-apple-darwin.tar.gz"
            "aster-v${version}-x86_64-pc-windows-msvc.zip"
            "aster-v${version}-x86_64-unknown-linux-musl.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            echo "release archive set mismatch" >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            printf 'actual:   %s\n' "${actual[*]}" >&2
            exit 1
          fi
          cd dist
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Verify archive members
        shell: bash
        run: |
          for archive in dist/*.tar.gz; do
            mapfile -t members < <(tar -tzf "$archive" | sed 's#^\./##' | sed '/^$/d' | sort)
            expected=(LICENSE README.md aster)
            if [[ "${members[*]}" != "${expected[*]}" ]]; then
              echo "unexpected members in $archive: ${members[*]}" >&2
              exit 1
            fi
          done
          version=$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          windows="dist/aster-v${version}-x86_64-pc-windows-msvc.zip"
          mapfile -t zip_members < <(unzip -Z1 "$windows" | sed '/\/$/d' | sort)
          expected_zip=(LICENSE README.md aster.exe)
          if [[ "${zip_members[*]}" != "${expected_zip[*]}" ]]; then
            echo "unexpected members in Windows archive: ${zip_members[*]}" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          notes="docs/releases/v${version}.md"
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ASTER $RELEASE_TAG" \
            --notes-file "$notes" \
            --verify-tag
